# Configuration for `cargo deny`, run via `just audit`.

[graph]
# Only the platforms `cargo dist` actually builds for. Without this, `cargo deny` walks
# target-specific dependencies we never compile (notably the UEFI-only `r-efi`, which is
# LGPL-2.1-or-later and reachable solely through `getrandom` on `*-unknown-uefi`).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[licenses]
# Permissive licences only. Every entry below is present in the current dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
